name: Release

on:
  push:
    tags:
      - "v*"
      - "log/v*"
      - "tools/v*"
      - "api/v*"
      - "frame/v*"
      - "workflow/v*"
      - "saas/v*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag naming check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 模块前缀白名单
          case "$TAG" in
            v*|log/v*|tools/v*|api/v*|frame/v*|workflow/v*|saas/v*) ;;
            *) echo "::error::invalid tag prefix: $TAG"; exit 1 ;;
          esac
          # 版本号必须是严格语义化版本
          VER="${TAG##*/}"
          if ! echo "$VER" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be strict semver (e.g. v0.5.0), got: $VER"; exit 1
          fi
          echo "tag=$TAG valid"

  test:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build & test all modules
        run: |
          for mod in log tools api frame workflow saas; do
            echo "=== $mod ==="
            (cd "$mod" && go build ./... && go test -count=1 ./...)
          done

  release-module:
    name: Release Go module
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    strategy:
      matrix:
        module: [log, tools, api, frame, workflow, saas]
    steps:
      - name: Skip if tag not for this module
        id: check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == "${{ matrix.module }}/v"* ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "VER=${TAG##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Verify module
        if: steps.check.outputs.match == 'true'
        run: |
          (cd "${{ matrix.module }}" && go mod verify)
          echo "Releasing ${{ matrix.module }}@${{ steps.check.outputs.VER }}"
      - name: Create GitHub Release
        if: steps.check.outputs.match == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-root:
    name: Release root (CLI / overall)
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Verify root module
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          echo "Releasing root $VER"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
