name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Run golangci-lint (all modules)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          for mod in log tools api frame workflow saas; do
            echo "=== Linting $mod ==="
            (cd "$mod" && golangci-lint run ./...)
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Test all modules
        run: |
          for mod in log tools api frame workflow saas; do
            echo "=== Testing $mod ==="
            (cd "$mod" && go test -race -count=1 -coverprofile="coverage.out" ./...)
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: log/coverage.out,tools/coverage.out,api/coverage.out,frame/coverage.out,workflow/coverage.out,saas/coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Build all modules
        run: |
          for mod in log tools api frame workflow saas; do
            echo "=== Building $mod ==="
            (cd "$mod" && go build ./...)
          done

  security:
    name: Security Scan (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Run gosec
        uses: securego/gosec@v2.22.2
        with:
          args: -severity high ./...

      - name: Run govulncheck (all modules)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          for mod in log tools api frame workflow saas; do
            echo "=== govulncheck $mod ==="
            (cd "$mod" && govulncheck ./...)
          done
