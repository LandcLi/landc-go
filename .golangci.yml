version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bodyclose
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - whitespace
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 20
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - staticcheck
          - unused
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - errcheck
          - gosec
        path: examples/
      - linters:
          - errcheck
        path: example/
      - linters:
          - gosec
        path: pkg/cmd/shell\.go
      - linters:
          - gosec
        path: str/string\.go
      - linters:
          - misspell
        path: pkg/model/status\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
